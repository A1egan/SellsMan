name: Apply board drag performance

on:
  push:
    branches: [feat/board-five-column-performance]
    paths:
      - scripts/apply_board_drag_performance.py
      - tests/board_drag_performance_probe.html
      - tests/test_board_drag_runtime.sh
      - .github/workflows/apply-board-drag-performance.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/board-five-column-performance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_board_drag_performance.py
      - run: bash tests/test_board_drag_runtime.sh
      - run: bash tests/test_board_five_column_runtime.sh
      - name: Commit optimized drag path
        run: |
          if git diff --quiet -- assets/workspace-v2.js assets/workspace-v2.css; then
            echo "Drag optimization already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/workspace-v2.js assets/workspace-v2.css
          git commit -m "perf: optimize customer board drag and drop"
          git push origin HEAD:feat/board-five-column-performance
