name: Apply board five-column CSS

on:
  push:
    branches: [feat/board-five-column-performance]
    paths:
      - scripts/apply_board_five_column_css.py
      - .github/workflows/apply-board-five-column-css.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/board-five-column-performance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_board_five_column_css.py
      - run: bash tests/test_board_five_column_runtime.sh
      - name: Commit patched CSS
        run: |
          if git diff --quiet -- assets/workspace-v2.css; then
            echo "CSS already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/workspace-v2.css
          git commit -m "feat: fit all five board columns on desktop"
          git push origin HEAD:feat/board-five-column-performance
