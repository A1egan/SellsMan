name: Apply board header layering fix

on:
  push:
    branches: [feat/board-five-column-performance]
    paths:
      - scripts/apply_board_header_layer_fix.py
      - .github/workflows/apply-board-header-layer-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/board-five-column-performance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_board_header_layer_fix.py
      - run: bash tests/test_tools_menu_layering.sh
      - run: bash tests/test_board_five_column_runtime.sh
      - run: bash tests/test_board_drag_runtime.sh
      - name: Commit board header layer fix
        run: |
          if git diff --quiet -- assets/workspace-v2.css; then
            echo "Header layer fix already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/workspace-v2.css
          git commit -m "fix: keep board tools menu above customer cards"
          git push origin HEAD:feat/board-five-column-performance
