name: Apply board scroll fix

on:
  push:
    branches: [fix/board-scroll-access]
    paths:
      - scripts/apply_board_scroll_fix.py
      - .github/workflows/apply-board-scroll-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/board-scroll-access
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply scroll viewport fix
        run: python scripts/apply_board_scroll_fix.py
      - name: Verify UI contract
        run: python tests/test_ui_contract.py
      - name: Commit fix
        run: |
          git config user.name "A1egan"
          git config user.email "g2j5rd9g8f@privaterelay.appleid.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "fix: keep board horizontal navigation reachable"
            git push origin HEAD:fix/board-scroll-access
          fi
