name: Apply tools menu layer fix

on:
  push:
    branches: [fix/tools-menu-layering]
    paths:
      - scripts/apply_tools_menu_layer_fix.py
      - .github/workflows/apply-tools-menu-layer-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tools-menu-layering
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_tools_menu_layer_fix.py
      - name: Commit patched workspace CSS
        run: |
          if git diff --quiet -- assets/workspace-v2.css; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/workspace-v2.css
          git commit -m "fix: keep tools menu above customer cards"
          git push origin HEAD:fix/tools-menu-layering
