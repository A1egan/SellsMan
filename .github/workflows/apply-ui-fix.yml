name: Apply UI fix

on:
  push:
    branches:
      - fix/menu-modal-scroll
    paths:
      - scripts/apply_ui_fix.py
      - tests/test_ui_contract.py
      - .github/workflows/apply-ui-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/menu-modal-scroll
          fetch-depth: 0
      - name: Apply UI fix
        run: python scripts/apply_ui_fix.py
      - name: Run regression tests
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          p = Path('tests/test_ui_contract.py')
          spec = importlib.util.spec_from_file_location('ui_contract', p)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          mod.test_header_uses_single_tools_menu()
          mod.test_detail_modal_is_viewport_bounded_and_scrollable()
          print('2 UI contract tests passed')
          PY
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          if not scripts:
              raise SystemExit('no inline script found')
          Path('/tmp/app.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit patched index
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: restore tools menu and scrollable detail modal"
          git push origin HEAD:fix/menu-modal-scroll
