name: Apply CRM workbench

on:
  push:
    branches: [feat/crm-ui-workbench]
    paths:
      - scripts/apply_workbench.py
      - .github/workflows/apply-workbench.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/crm-ui-workbench
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply workbench UI
        run: python scripts/apply_workbench.py
      - name: Verify UI and data contracts
        run: python tests/test_ui_contract.py
      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: rebuild CRM as dense laptop workbench"
          git push origin HEAD:feat/crm-ui-workbench
