name: Apply workspace readability fix

on:
  push:
    branches: [fix/workspace-board-and-scale]
    paths:
      - scripts/apply_workspace_readability_fix.py
      - .github/workflows/apply-workspace-readability-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/workspace-board-and-scale
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_workspace_readability_fix.py
      - name: Commit patched CSS
        run: |
          if git diff --quiet -- assets/workspace-v2.css; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/workspace-v2.css
          git commit -m "fix: improve board reachability and workspace readability"
          git push origin HEAD:fix/workspace-board-and-scale
