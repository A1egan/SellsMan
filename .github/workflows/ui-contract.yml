name: UI contract

on:
  push:
    branches: [design/crm-workspace-v2]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/test_ui_contract.py
      - run: python tests/test_workspace_v2_contract.py
      - run: python tests/test_workspace_v2_readability.py
      - run: node tests/test_workspace_v2_core.js
      - run: bash tests/test_board_five_column_runtime.sh
      - run: bash tests/test_board_drag_runtime.sh
      - run: bash tests/test_tools_menu_layering.sh
      - run: bash tests/test_workspace_v2_browser.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-v2-screenshots
          path: /tmp/workspace-v2-shots/*.png
          if-no-files-found: ignore
          retention-days: 3
