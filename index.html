<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A1eG4n工作台 · 跟进CRM</title>
<style>
:root {
  --bg: #0a0a0a;
  --bg-pattern: #111111;
  --card-bg: #ffffff;
  --text: #111111;
  --text-secondary: #444444;
  --text-light: #ffffff;
  --border: #e5e7eb;
  --primary: #3b82f6;
  --primary-light: #dbeafe;
  --green: #34d399;
  --green-light: #ecfdf5;
  --orange: #fb923c;
  --orange-light: #fff7ed;
  --red: #ef4444;
  --red-light: #fef2f2;
  --shadow: 0 2px 10px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.14);
  --radius: 12px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background-color: var(--bg);
  background-image: linear-gradient(rgba(200,200,200,0.30), rgba(200,200,200,0.40)), url('manga-bg.jpg');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  color: var(--text);
  min-height: 100vh;
}

/* ====== 顶部栏 ====== */
.header {
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(12px);
  color: #222;
  border-bottom: 1px solid #e5e7eb;
  padding: 14px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 14px rgba(0,0,0,0.08);
  min-height: 60px;
}

.header h1 {
  font-size: 22px;
  font-weight: 900;
  white-space: nowrap;
  letter-spacing: 1px;
  color: #222;
}

.header-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  justify-content: flex-end;
}

.tools-menu-wrap {
  position: relative;
}

.tools-menu {
  display: none;
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  z-index: 300;
  width: 156px;
  padding: 6px;
  background: #fff;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  box-shadow: 0 12px 30px rgba(0,0,0,0.16);
}

.tools-menu.show { display: block; }

.tools-menu-item {
  display: block;
  width: 100%;
  padding: 9px 10px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: #333;
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  text-align: left;
  cursor: pointer;
}

.tools-menu-item:hover { background: #f3f4f6; }

.input-box {
  display: flex;
  align-items: center;
  gap: 6px;
}

.input-box input {
  padding: 7px 12px;
  border: 1px solid #d1d5db;
  border-radius: var(--radius);
  font-size: 14px;
  outline: none;
  width: 160px;
  background: rgba(255,255,255,0.95);
  transition: all 0.15s;
}

.input-box input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
}

.btn {
  padding: 7px 14px;
  border: 1px solid #d1d5db;
  border-radius: var(--radius);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
  box-shadow: 0 1px 2px rgba(0,0,0,0.05);
}

.btn-primary {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}

.btn-primary:hover {
  background: #2563eb;
  border-color: #2563eb;
  color: #fff;
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(59,130,246,0.35);
}

.btn-secondary {
  background: var(--red);
  color: #fff;
  border-color: var(--red);
}

.btn-secondary:hover { background: #dc2626; border-color: #dc2626; }

.btn-outline {
  background: rgba(255,255,255,0.9);
  border: 1px solid #d1d5db;
  color: #333;
}

.btn-outline:hover { background: #f9fafb; transform: translateY(-1px); }

.btn-sm {
  padding: 4px 10px;
  font-size: 12px;
}

.search-box {
  padding: 7px 12px;
  border: 1px solid #d1d5db;
  border-radius: var(--radius);
  font-size: 14px;
  outline: none;
  width: 180px;
  background: rgba(255,255,255,0.95);
  transition: all 0.15s;
}

.search-box:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
}

/* ====== 统计栏 ====== */
.stats-bar {
  display: flex;
  gap: 16px;
  padding: 10px 24px;
  background: #fff;
  border-bottom: 1px solid #e5e7eb;
  box-shadow: var(--shadow);
}

.stat-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: #333;
  font-weight: 600;
}

.stat-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  border: 1px solid #d1d5db;
}

.stat-num {
  font-weight: 900;
  font-size: 16px;
  color: #333;
}

/* ====== 看板主体 ====== */
.board {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 16px 24px;
  overflow-x: auto;
  min-height: calc(100vh - 110px);
}

.column {
  flex: 0 0 280px;
  background: var(--card-bg);
  border-radius: 14px;
  border: 1px solid #e5e7eb;
  display: flex;
  flex-direction: column;
  align-self: flex-start;
  box-shadow: var(--shadow);
}

.column-header {
  padding: 12px 14px;
  border-bottom: 1px solid #e5e7eb;
  background: #f9fafb;
  border-radius: 14px 14px 0 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.column-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: 900;
  color: #1f2937;
}

.column-badge {
  background: #fff;
  color: #374151;
  font-size: 12px;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 800;
  border: 1px solid #e5e7eb;
}

.column-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  box-shadow: 0 0 0 2px rgba(255,255,255,0.9);
}

/* 栏目筛选 */
.col-filter { position: relative; }

.col-filter-btn {
  padding: 3px 8px;
  font-size: 11px;
  font-weight: 700;
  color: #333;
  background: #fff;
  border: 1px solid #999;
  border-radius: 10px;
  cursor: pointer;
  white-space: nowrap;
}

.col-filter-btn:hover { background: #eee; }

.col-filter-btn.on {
  background: #3b82f6;
  color: #fff;
  border-color: #2563eb;
}

.col-filter-menu {
  position: absolute;
  top: calc(100% + 4px);
  right: 0;
  z-index: 200;
  min-width: 150px;
  max-height: 260px;
  overflow-y: auto;
  background: #fff;
  border: 1px solid #e5e7eb;
  border-radius: 10px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.14);
  display: none;
}

.col-filter-menu.show { display: block; }

.col-filter-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 10px;
  font-size: 13px;
  color: #333;
  cursor: pointer;
}

.col-filter-item:hover { background: #f0f0f0; }

.column-body {
  padding: 8px;
  min-height: 100px;
  transition: background 0.2s;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 6px;
  align-items: start;
}

.column-body.drag-over {
  background: var(--primary-light);
}

.column-body .show-more-btn,
.column-body .empty-state { grid-column: 1 / -1; }

.column-actions {
  padding: 8px 14px;
  border-top: 1px solid var(--border);
  display: none;
}

.column-actions.show { display: flex; gap: 6px; }

/* ====== 卡片 ====== */
.card {
  background: var(--card-bg);
  border: 1px solid #e5e7eb;
  border-radius: 10px;
  padding: 6px 8px;
  margin-bottom: 0;
  cursor: grab;
  transition: all 0.15s;
  position: relative;
  box-shadow: 0 1px 2px rgba(0,0,0,0.04);
}

.card:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(0,0,0,0.10);
  border-color: #d1d5db;
}

.card.selected {
  border-color: var(--primary);
  box-shadow: 0 0 0 2px var(--primary-light);
  background: #f8fafc;
}

.card.dragging {
  opacity: 0.4;
  cursor: grabbing;
}

/* ====== 紧凑模式 ====== */
.compact .card {
  padding: 6px 10px;
  margin-bottom: 4px;
}
.compact .card-top {
  margin-bottom: 2px;
}
.compact .card-number {
  font-size: 14px;
}
.compact .card-note {
  margin-top: 2px;
  padding: 3px 6px;
  font-size: 11px;
  display: -webkit-box;
  -webkit-line-clamp: 1;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.compact .card-meta {
  font-size: 11px;
}
.compact .card-time {
  font-size: 10px;
}
.compact .card-actions {
  margin-top: 4px;
}
.compact .column {
  flex: 0 0 230px;
}
.compact .column-header {
  padding: 8px 12px;
}
.compact .card-note {
  display: -webkit-box;
  -webkit-line-clamp: 1;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}

.card-number {
  font-size: 14px;
  font-weight: 900;
  color: #333;
  letter-spacing: 0.3px;
}

.card-checkbox {
  width: 18px;
  height: 18px;
  cursor: pointer;
  accent-color: var(--primary);
}

.card-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--text-secondary);
  flex-wrap: wrap;
}

.card-note {
  font-size: 12px;
  color: #222;
  margin-top: 4px;
  padding: 5px 8px;
  background: #f2f2f2;
  border-left: 3px solid #cccccc;
  word-break: break-all;
  font-weight: 500;
}

/* ====== 待跟进三列小卡 ====== */
.column-body[data-col="pending"] {
  grid-template-columns: repeat(3, 1fr);
}
.column-body[data-col="pending"] .card {
  padding: 5px 6px;
}
.column-body[data-col="pending"] .card-number {
  font-size: 13px;
}

.card-reply-badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  background: var(--green-light);
  color: #047857;
  font-size: 11px;
  padding: 2px 6px;
  border-radius: 4px;
  font-weight: 600;
}

.card-actions {
  display: flex;
  gap: 4px;
  margin-top: 6px;
  opacity: 0;
  transition: opacity 0.2s;
}

.card:hover .card-actions { opacity: 1; }

.card-action-btn {
  font-size: 11px;
  padding: 3px 8px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  background: #fff;
  cursor: pointer;
  color: #333;
  font-weight: 700;
  transition: all 0.15s;
}

.card-action-btn:hover {
  background: #ddd;
  color: #222;
}

.card-action-btn.danger:hover {
  background: var(--red);
  color: #fff;
  border-color: #999;
}

.card-time {
  font-size: 11px;
  color: #555;
  font-weight: 500;
}

/* ====== 空状态 ====== */
.empty-state {
  text-align: center;
  padding: 30px 10px;
  color: #d1d5db;
  font-size: 13px;
}

.show-more-btn {
  width: 100%;
  padding: 8px;
  margin-top: 4px;
  border: 1px dashed #d1d5db;
  border-radius: var(--radius);
  background: #fff;
  color: #555;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
}

.show-more-btn:hover {
  background: #f3f4f6;
  color: #222;
}

/* ====== 标签 ====== */
.card-tagicon {
  font-size: 12px;
  opacity: 0.4;
  cursor: pointer;
  transition: opacity 0.15s;
}
.card:hover .card-tagicon { opacity: 0.9; }

.card-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 4px;
  align-items: center;
}

.tag-dot-sm {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  flex-shrink: 0;
  cursor: pointer;
  box-shadow: 0 0 0 1px rgba(0,0,0,0.15);
  transition: transform 0.1s;
}
.tag-dot-sm:hover { transform: scale(1.25); }

.tag-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 10px;
  border: 1px solid;
  white-space: nowrap;
  cursor: pointer;
  line-height: 1.4;
  color: #fff !important;
  border-color: transparent !important;
  box-shadow: 0 1px 2px rgba(0,0,0,0.15);
}
.tag-chip.lg { font-size: 12px; padding: 4px 9px; }

.tag-chip-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
  border: 1px solid rgba(0,0,0,0.2);
}

.tag-x {
  cursor: pointer;
  font-weight: 700;
  margin-left: 2px;
  opacity: 0.6;
}
.tag-x:hover { opacity: 1; }

.muted-text {
  color: #9ca3af;
  font-size: 12px;
}

.current-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  min-height: 28px;
  align-items: center;
}

.all-tags {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 220px;
  overflow-y: auto;
}

.tag-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s;
}
.tag-row:hover { background: #f9fafb; }
.tag-row.on {
  background: var(--primary-light);
  border-color: var(--primary);
}

.tag-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

.tag-name {
  flex: 1;
  font-size: 13px;
  font-weight: 500;
}

.tag-ops {
  display: flex;
  gap: 2px;
}

.tag-op {
  border: none;
  background: transparent;
  cursor: pointer;
  font-size: 13px;
  padding: 2px 5px;
  border-radius: 4px;
  opacity: 0.6;
  transition: all 0.15s;
}
.tag-op:hover { opacity: 1; background: #e5e7eb; }
.tag-op.danger:hover { background: var(--red-light); }

.tag-row.editing {
  cursor: default;
  border-width: 2px;
  align-items: center;
}
.tag-edit-input {
  flex: 1;
  padding: 5px 8px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 13px;
  outline: none;
}
.tag-edit-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }

.new-tag-row {
  display: flex;
  gap: 6px;
}
.new-tag-row input {
  flex: 1;
  padding: 8px 12px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 14px;
  outline: none;
  background: #fafafa;
}
.new-tag-row input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); background: #fff; }

.detail-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

/* ====== 标签筛选栏 ====== */
.tag-filter-bar {
  display: none;
  align-items: center;
  gap: 10px;
  padding: 8px 24px;
  background: #fff;
  border-bottom: 1px solid #e5e7eb;
}
.tag-filter-bar.show { display: flex; }
.tf-label { font-size: 13px; color: #333; font-weight: 700; }
.tf-clear {
  border: 1px solid #d1d5db;
  background: #fff;
  color: #333;
  font-size: 12px;
  padding: 4px 10px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 700;
  box-shadow: 0 1px 2px rgba(0,0,0,0.05);
}
.tf-clear:hover { background: #ddd; color: #222; }

/* ====== 模态框 ====== */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.4);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}

.modal-overlay.show { display: flex; }

.modal {
  background: #fff;
  border-radius: 16px;
  padding: 24px;
  width: 420px;
  max-width: 90vw;
  max-height: 86vh;
  overflow-y: auto;
  overscroll-behavior: contain;
  border: 1px solid #e5e7eb;
  box-shadow: 0 12px 40px rgba(0,0,0,0.18);
}

.modal h2 {
  font-size: 18px;
  margin-bottom: 16px;
  font-weight: 900;
  border-bottom: 1px solid #e5e7eb;
  padding-bottom: 10px;
}

.modal-field {
  margin-bottom: 14px;
}

.modal-field label {
  display: block;
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 4px;
}

.modal-field input,
.modal-field textarea,
.modal-field select {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  font-size: 14px;
  outline: none;
  font-family: inherit;
  background: #fafafa;
}

.modal-field input:focus,
.modal-field textarea:focus,
.modal-field select:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
  background: #fff;
}

.modal-field textarea {
  resize: vertical;
  min-height: 60px;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 20px;
}

/* ====== Toast ====== */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: #111827;
  color: #fff;
  padding: 10px 20px;
  border-radius: 10px;
  border: none;
  font-size: 14px;
  font-weight: 700;
  z-index: 2000;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
  box-shadow: 0 6px 20px rgba(0,0,0,0.25);
}

.toast.show { opacity: 1; }

/* ====== 批量操作栏 ====== */
.batch-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #ffffff;
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 1px solid #e5e7eb;
  box-shadow: 0 -4px 16px rgba(0,0,0,0.10);
  color: #1f2937;
  z-index: 1500;
  transform: translateY(100%);
  transition: transform 0.3s;
}

.batch-bar.show { transform: translateY(0); }

.batch-bar-left {
  color: #1f2937;
  font-size: 14px;
}

.batch-bar-right {
  display: flex;
  gap: 8px;
}

.batch-btn {
  padding: 6px 14px;
  border: none;
  border-radius: var(--radius);
  font-size: 13px;
  cursor: pointer;
  font-weight: 500;
}

.batch-btn-red {
  background: var(--red);
  color: #fff;
}

.batch-btn-red:hover { background: #dc2626; }

.batch-btn-gray {
  background: #fff;
  color: #333;
  border: 1px solid #d1d5db;
}

.batch-btn-gray:hover { background: #f3f4f6; color: #222; }

.batch-btn-blue {
  background: #3b82f6;
  color: #fff;
}

.batch-btn-blue:hover { background: #2563eb; }

.batch-bar select {
  padding: 6px 10px;
  border: 1px solid #d1d5db;
  border-radius: var(--radius);
  font-size: 13px;
  font-family: inherit;
  background: #fff;
  color: #333;
  outline: none;
  cursor: pointer;
}

/* ====== 导入区 ====== */
.import-area {
  padding: 8px 14px;
  border-top: 1px solid var(--border);
  display: none;
}

.import-area.show { display: block; }

.import-area textarea {
  width: 100%;
  padding: 8px;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  font-size: 13px;
  resize: vertical;
  min-height: 60px;
  font-family: inherit;
  outline: none;
  background: #fafafa;
}

.import-area textarea:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
  background: #fff;
}

.import-area .import-btns {
  display: flex;
  gap: 6px;
  margin-top: 6px;
}

.import-area .import-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
}

.import-area .import-label {

function init() {

  populateBatchMoveCol();
  populateBatchAddTag();
  populateBatchAddCol();
  renderTagFilterBar();

  document.addEventListener('click', () => {
    document.querySelectorAll('.col-filter-menu.show').forEach(m => m.classList.remove('show'));
  });
}

function toggleToolsMenu(event) {
  if (event) event.stopPropagation();
  const menu = document.getElementById('toolsMenu');
  if (!menu) return;
  const willOpen = !menu.classList.contains('show');
  document.querySelectorAll('.col-filter-menu.show').forEach(m => m.classList.remove('show'));
  menu.classList.toggle('show', willOpen);
}

function closeToolsMenu() {
  const menu = document.getElementById('toolsMenu');
  if (menu) menu.classList.remove('show');
}

document.addEventListener('click', closeToolsMenu);

function loadData() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) {
    try {
      users = JSON.parse(raw);
    } catch(e) {
      users = [];
    }
  }
  // 兼容旧数据：补齐 CRM 字段
  users.forEach(u => {
    if (!Array.isArray(u.tags)) u.tags = [];
    if (!Array.isArray(u.history)) u.history = [];
    if (typeof u.nextFollowUpAt !== 'number') u.nextFollowUpAt = 0;
    if (typeof u.nextAction !== 'string') u.nextAction = '';
    if (typeof u.lastResult !== 'string') u.lastResult = '';
    if (typeof u.lastContactAt !== 'number') u.lastContactAt = 0;
  });
  // 与种子数据对齐：若某用户无标签但种子中有，则补上标签（让老数据也能显示色点）
  const seedTagMap = {};
  IMPORTED_USERS.forEach(s => { if (s.tags && s.tags.length) seedTagMap[s.id] = s.tags.slice(); });
  users.forEach(u => {
    if ((!u.tags || u.tags.length === 0) && seedTagMap[u.id]) {
      u.tags = seedTagMap[u.id].slice();
    }
  });
  // 首次使用，加载导入的 Excel 数据（强化群学员跟进）
  if (users.length === 0) {
    users = IMPORTED_USERS.map(u => ({
      ...u,
      replied: false,
      history: [],
      nextFollowUpAt: 0,
      nextAction: '',
      lastResult: '',
      lastContactAt: 0,
      createdAt: Date.now(),
      updatedAt: Date.now(),
    }));
    saveData();
  }
}

function loadTags() {
  const raw = localStorage.getItem(TAGS_KEY);
  if (raw) {
    try { tags = JSON.parse(raw); } catch(e) { tags = []; }
  }
  if (!Array.isArray(tags)) tags = [];
  // 始终确保三个核心标签存在且配色正确：蓝色「99体验」、浅紫「算法营1」、深紫「算法营2」
  const CORE_TAGS = [
    {id: "tag_99",   name: "99体验",  color: "#3b82f6"},
    {id: "tag_algo1", name: "算法营1", color: "#a78bfa"},
    {id: "tag_algo2", name: "算法营2", color: "#6d28d9"}
  ];
  CORE_TAGS.forEach(c => {
    const ex = tags.find(t => t.id === c.id);
    if (ex) { ex.name = c.name; ex.color = c.color; }
    else tags.push({...c});
  });
  saveTags();
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(users));
}

function saveTags() {
  localStorage.setItem(TAGS_KEY, JSON.stringify(tags));
}

// ====== 主渲染 ======
function render() {
  const searchVal = document.getElementById('searchInput').value.trim().toLowerCase();
  
  COLUMNS.forEach(col => {
    const body = document.querySelector(`.column-body[data-col="${col.id}"]`);
    let colUsers = users.filter(u => u.column === col.id);
    // 跟进任务过滤
    if (taskFilter !== 'all') {
      colUsers = colUsers.filter(u => matchesTaskFilter(u, taskFilter));
    }
    
    // 搜索过滤（支持数字与字母，匹配用户标识或备注）
    if (searchVal) {
      colUsers = colUsers.filter(u => 
        u.number.toLowerCase().includes(searchVal) || 
        (u.note && u.note.toLowerCase().includes(searchVal)) ||
        (u.tags && u.tags.some(tid => { const t = getTag(tid); return t && t.name.toLowerCase().includes(searchVal); }))
      );
    }
    // 标签筛选
    if (activeTagFilter) {
      colUsers = colUsers.filter(u => u.tags && u.tags.includes(activeTagFilter));
    }
    // 栏目级标签筛选
    if (colFilters[col.id]) {
      colUsers = colUsers.filter(u => u.tags && u.tags.includes(colFilters[col.id]));
    }
    
    // 优先显示逾期/今日任务，其次按下次跟进时间、更新时间排序
    colUsers.sort((a, b) => {
      const ar = followupRank(a), br = followupRank(b);
      if (ar !== br) return ar - br;
      const at = a.nextFollowUpAt || Number.MAX_SAFE_INTEGER;
      const bt = b.nextFollowUpAt || Number.MAX_SAFE_INTEGER;
      if (at !== bt) return at - bt;
      return b.updatedAt - a.updatedAt;
    });
    
    // 更新计数
    const countEl = document.getElementById(`count-${col.id}`);
    if (countEl) countEl.textContent = colUsers.length;
    
    // 更新筛选按钮状态
    const fbtn = document.getElementById(`filterBtn-${col.id}`);
    if (fbtn) {
      const f = colFilters[col.id];
      if (f) {
        const t = getTag(f);
        fbtn.classList.add('on');
        fbtn.textContent = '筛选: ' + (t ? t.name : '');
      } else {
        fbtn.classList.remove('on');
        fbtn.textContent = '筛选';
      }
    }
    
    // 渲染卡片
    if (colUsers.length === 0) {
      body.innerHTML = '<div class="empty-state">暂无用户</div>';
    } else {
      const isExpanded = expandedCols.has(col.id) || !!searchVal;
      const visible = isExpanded ? colUsers : colUsers.slice(0, COLUMN_LIMIT);
      let html = visible.map(u => renderCard(u)).join('');
      if (!isExpanded && colUsers.length > COLUMN_LIMIT) {
        const rest = colUsers.length - COLUMN_LIMIT;
        html += `<button class="show-more-btn" onclick="expandCol('${col.id}')">显示更多（剩 ${rest} 个）↓</button>`;
      }
      body.innerHTML = html;
    }
  });
  
  renderTaskBar();
}

function expandCol(colId) {
  expandedCols.add(colId);
  render();
  showToast('已展开全部');
}

function renderCard(u) {
  const isSelected = selectedIds.has(u.id);
  const followupStatus = getFollowupStatus(u);
  const visibleTags = (u.tags || []).slice(0, 3);
  const tagDots = visibleTags.map(tid => {
    const t = getTag(tid);
    if (!t) return '';
    return `<span class="tag-dot-sm" style="background:${t.color}" title="${escapeHtml(t.name)}（点击筛选）" onclick="event.stopPropagation(); filterByTag('${t.id}')"></span>`;
  }).join('');
  const extraTags = (u.tags || []).length > 3 ? `<span class="tag-more">+${(u.tags || []).length - 3}</span>` : '';
  const hoverText = u.note ? `备注：${escapeHtml(u.note)}` : `学员 ${escapeHtml(u.number)}`;
  return `
    <div class="card ${isSelected ? 'selected' : ''} status-${followupStatus}"
         draggable="true"
         data-id="${u.id}"
         data-followup-status="${followupStatus}"
         title="${hoverText}"
         ondragstart="onDragStart(event, '${u.id}')"
         ondragend="onDragEnd(event)"
         onclick="onCardClick(event, '${u.id}')">
      <div class="card-top">
        <span class="card-number">${escapeHtml(u.number)}</span>
        <div class="card-signals">
          ${tagDots}${extraTags}
          ${batchMode ? `<input type="checkbox" class="card-checkbox" ${isSelected ? 'checked' : ''} onclick="event.stopPropagation(); toggleSelect('${u.id}')">` : ''}
        </div>
      </div>
      ${renderCardFollowup(u)}
      <div class="card-action ${u.nextAction ? '' : 'muted'}">${escapeHtml(u.nextAction || '未安排下一步')}</div>
    </div>
  `;
}


function startOfToday() {
  const d = new Date(); d.setHours(0,0,0,0); return d.getTime();
}
function startOfTomorrow() {
  const d = new Date(); d.setHours(24,0,0,0); return d.getTime();
}
function getFollowupStatus(u) {
  const t = Number(u.nextFollowUpAt || 0);
  if (!t) return 'unscheduled';
  const today = startOfToday(), tomorrow = startOfTomorrow();
  if (t < today) return 'overdue';
  if (t < tomorrow) return 'today';
  return 'future';
}
function matchesTaskFilter(u, f) {
  return f === 'all' ? true : getFollowupStatus(u) === f;
}
function followupRank(u) {
  const s = getFollowupStatus(u);
  return ({overdue:0,today:1,future:2,unscheduled:3})[s] ?? 4;
}
function formatFollowupDate(ts) {
  if (!ts) return '';
  const d = new Date(ts); const now = new Date();
  const pad=n=>String(n).padStart(2,'0');
  const sameYear=d.getFullYear()===now.getFullYear();
  return `${sameYear?'':d.getFullYear()+'/'}${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function renderCardFollowup(u) {
  const st = getFollowupStatus(u);
  if (st === 'unscheduled') {
    return '<div class="card-followup unscheduled">未安排时间</div>';
  }
  const time = formatFollowupDate(u.nextFollowUpAt);
  const prefix = st === 'overdue' ? '已逾期' : (st === 'today' ? '今日跟进' : '下次');
  return `<div class="card-followup ${st}">${prefix}<span>${time}</span></div>`;
}
function setTaskFilter(f) {
  taskFilter = f;
  expandedCols.clear();
  render();
}
function renderTaskBar() {
  const el = document.getElementById('taskBar'); if (!el) return;
  const count = f => users.filter(u => matchesTaskFilter(u,f)).length;
  const todayCount = count('today'), overdueCount=count('overdue'), futureCount=count('future'), unscheduledCount=count('unscheduled');
  const effective = countEffectiveToday();
  const pill=(f,label,n,cls='')=>`<button class="task-pill ${cls} ${taskFilter===f?'active':''}" onclick="setTaskFilter('${f}')">${label} <span class="n">${n}</span></button>`;
  el.innerHTML = `<span class="task-title">跟进任务</span>
    ${pill('all','全部',users.length)}
    ${pill('today','今日',todayCount)}
    ${pill('overdue','逾期',overdueCount,'overdue')}
    ${pill('future','未来',futureCount)}
    ${pill('unscheduled','未安排',unscheduledCount)}
    <span class="effective-kpi">今日有效沟通 <b class="${effective>=20?'ok':''}">${effective}</b> / 20</span>`;
}
function countEffectiveToday() {
  const st=startOfToday(), ed=startOfTomorrow(); let n=0;
  users.forEach(u => (u.history||[]).forEach(h => {
    if (h.at>=st && h.at<ed && h.result && h.result!=='未回复') n++;
  }));
  return n;
}

function renderStats() {
  const total = users.length;
  const cnt = {};
  COLUMNS.forEach(c => { cnt[c.id] = users.filter(u => u.column === c.id).length; });
  const colItems = COLUMNS.map(c =>
    `<div class="stat-item"><span class="stat-dot" style="background:${c.dot}"></span>${c.name} <span class="stat-num">${cnt[c.id]||0}</span></div>`
  ).join('');
  
  document.getElementById('statsBar').innerHTML = `
    ${colItems}
    <div class="stat-item"><span class="stat-dot" style="background:#4f46e5"></span>总计 <span class="stat-num">${total}</span></div>
  `;
}

// ====== 拖拽 ======
function onDragStart(e, id) {
  dragId = id;
  e.dataTransfer.effectAllowed = 'move';
  e.target.classList.add('dragging');
}

function onDragEnd(e) {
  e.target.classList.remove('dragging');
  document.querySelectorAll('.column-body').forEach(b => b.classList.remove('drag-over'));
}

function onDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('drag-over');
}

function onDragLeave(e) {
  e.currentTarget.classList.remove('drag-over');
}

function onDrop(e) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if (!dragId) return;
  
  const newCol = e.currentTarget.dataset.col;
  const user = users.find(u => u.id === dragId);
  if (user && user.column !== newCol) {
    user.column = newCol;
    user.updatedAt = Date.now();
    saveData();
    render();
    const colName = COLUMNS.find(c => c.id === newCol).name;
    showToast(`已移至「${colName}」`);
  }
  dragId = null;
}

function batchAddUsers() {
  const text = document.getElementById('batchInput').value.trim();
  if (!text) {
    showToast('请输入用户编号');
    return;
  }
  const tagSel = document.getElementById('batchAddTag');
  const tagId = tagSel ? tagSel.value : '';
  const colSel = document.getElementById('batchAddCol');
  const colId = colSel && colSel.value ? colSel.value : 'pending';
  const colName = COLUMNS.find(c => c.id === colId)?.name || '';
  const numbers = text.split(/[\n,，\s]+/).map(s => s.trim()).filter(Boolean);
  let added = 0;
  let skipped = 0;
  numbers.forEach(num => {
    if (users.some(u => u.number === num)) {
      skipped++;
    } else {
      users.push({
        id: genId(),
        number: num,
        column: colId,
        note: '',
        replied: false,
        tags: tagId ? [tagId] : [],
        history: [],
        nextFollowUpAt: 0,
        nextAction: '',
        lastResult: '',
        lastContactAt: 0,
        createdAt: Date.now(),
        updatedAt: Date.now()
      });
      added++;
    }
  });
  saveData();
  render();
  document.getElementById('batchInput').value = '';
  document.getElementById('importArea').classList.remove('show');
  const tagName = tagId ? (getTag(tagId)?.name || '') : '';
  showToast(`已导入 ${added} 个用户${skipped > 0 ? `，跳过 ${skipped} 个重复` : ''}${colName ? `，栏目「${colName}」` : ''}${tagName ? `，标签「${tagName}」` : ''}`);
}

function renderTagModal() {
  const user = users.find(u => u.id === modalUserId);
  if (!user) return;

  const detailColumnBadge = document.getElementById('detailColumnBadge');
  const detailTagSummary = document.getElementById('detailTagSummary');
  const col = COLUMNS.find(c => c.id === user.column);
  if (detailColumnBadge) detailColumnBadge.textContent = col ? col.name : user.column;
  if (detailTagSummary) {
    const names = (user.tags || []).map(id => getTag(id)?.name).filter(Boolean);
    detailTagSummary.textContent = names.length ? names.join(' · ') : '暂无标签';
  }

  // 备注与跟进
  document.getElementById('detailNote').value = user.note || '';
  document.getElementById('detailResult').value = user.lastResult || '';
  document.getElementById('detailNextAction').value = user.nextAction || '';
  document.getElementById('detailNextTime').value = toDatetimeLocal(user.nextFollowUpAt || 0);
  renderFollowupHistory(user);

  // 当前标签
  const cur = document.getElementById('currentTags');
    if (!user.tags || user.tags.length === 0) {
    cur.innerHTML = '<span class="muted-text">暂无标签</span>';
  } else {
    cur.innerHTML = user.tags.map(tid => {
      const t = getTag(tid);
      if (!t) return '';
      return `<span class="tag-chip lg" style="background:${t.color}">

      </span>`;
    }).join('');
  }

  // 所有标签
  const all = document.getElementById('allTags');
  all.innerHTML = tags.map(t => {
    const has = user.tags && user.tags.includes(t.id);
    if (tagEditId === t.id) {
      return `<div class="tag-row editing" style="border-color:${t.color}">
        <span class="tag-dot" style="background:${t.color}"></span>
        <input class="tag-edit-input" id="tagEditInput" value="${escapeHtml(t.name)}" onkeydown="if(event.key==='Enter')commitTagRename('${t.id}');if(event.key==='Escape')cancelTagEdit()">
        <button class="btn btn-primary btn-sm" onclick="commitTagRename('${t.id}')">保存</button>
        <button class="btn btn-outline btn-sm" onclick="cancelTagEdit()">取消</button>
      </div>`;
    }
    return `<div class="tag-row ${has ? 'on' : ''}" onclick="toggleUserTag('${t.id}')">
      <span class="tag-dot" style="background:${t.color};box-shadow:0 0 0 1px rgba(0,0,0,0.2)"></span>
      <span class="tag-name">${escapeHtml(t.name)}</span>
      <span class="tag-ops" onclick="event.stopPropagation()">
        <button class="tag-op" title="重命名" onclick="startTagEdit('${t.id}')">✎</button>
        <button class="tag-op danger" title="删除标签" onclick="deleteTag('${t.id}')">🗑</button>
      </span>
    </div>`;
  }).join('');
  if (tags.length === 0) {
    all.innerHTML = '<span class="muted-text">还没有标签，去下面新建一个</span>';
  }
}


function toDatetimeLocal(ts) {
  if (!ts) return '';
  const d=new Date(ts), pad=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function setQuickFollowup(days) {
  const d=new Date(); d.setDate(d.getDate()+days); d.setHours(10,0,0,0);
  document.getElementById('detailNextTime').value=toDatetimeLocal(d.getTime());
}
function setQuickFollowupDate(v) {
  document.getElementById('detailNextTime').value=v;
}
function clearFollowupTime() { document.getElementById('detailNextTime').value=''; }
function logFollowup() {
  const user=users.find(u=>u.id===modalUserId); if(!user) return;
  const note=document.getElementById('detailNote').value.trim();
  const result=document.getElementById('detailResult').value;
  const action=document.getElementById('detailNextAction').value.trim();
  const timeVal=document.getElementById('detailNextTime').value;
  const nextAt=timeVal ? new Date(timeVal).getTime() : 0;
  if (!result && !note && !action && !nextAt) { showToast('至少记录一项沟通信息'); return; }
  const now=Date.now();
  user.note=note;
  user.lastResult=result;
  user.lastContactAt=now;
  user.nextAction=action;
  user.nextFollowUpAt=nextAt;
  user.updatedAt=now;
  if (!Array.isArray(user.history)) user.history=[];
  user.history.unshift({at:now,result:result||'已记录',note, nextAction:action, nextFollowUpAt:nextAt});
  if (user.history.length>60) user.history=user.history.slice(0,60);
  // 轻量自动分层：仅在明确结果时调整，避免误改
  if (result==='有意向') user.column='contacting';
  else if (result==='已了解情况' || result==='已发现需求') { if(user.column==='pending') user.column='replied'; }
  else if (result==='明确不考虑') user.column='lowinterest';
  saveData(); render(); renderTagModal(); showToast('已记录本次沟通');
}
function renderFollowupHistory(user) {
  const box=document.getElementById('followupHistory'); if(!box) return;
  const hs=Array.isArray(user.history)?user.history:[];
  if(!hs.length){ box.innerHTML='<div class="worklog-item" style="color:#9ca3af">暂无沟通记录</div>'; return; }
  box.innerHTML=hs.slice(0,5).map(h=>`<div class="worklog-item">
    <div><span class="worklog-result">${escapeHtml(h.result||'记录')}</span> <span class="worklog-time">${formatAbsoluteTime(h.at)}</span></div>
    ${h.note?`<div class="worklog-note">${escapeHtml(h.note)}</div>`:''}
    ${h.nextAction?`<div class="worklog-note">下一步：${escapeHtml(h.nextAction)}${h.nextFollowUpAt?' · '+formatFollowupDate(h.nextFollowUpAt):''}</div>`:''}
  </div>`).join('');
}
function formatAbsoluteTime(ts) {
  if(!ts) return '';
  const d=new Date(ts), pad=n=>String(n).padStart(2,'0');
  return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function copyFollowupSummary() {
  const user=users.find(u=>u.id===modalUserId); if(!user) return;
  const tagNames=(user.tags||[]).map(id=>getTag(id)?.name).filter(Boolean).join('、')||'无';
  const text=`学员 ${user.number}\n标签：${tagNames}\n当前状态：${COLUMNS.find(c=>c.id===user.column)?.name||user.column}\n最近结果：${user.lastResult||'未记录'}\n备注：${user.note||'无'}\n下一步：${user.nextAction||'未安排'}${user.nextFollowUpAt?'\n下次跟进：'+formatFollowupDate(user.nextFollowUpAt):''}`;
  navigator.clipboard?.writeText(text).then(()=>showToast('跟进摘要已复制')).catch(()=>fallbackCopy(text));
}
function fallbackCopy(text){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); showToast('跟进摘要已复制'); }

function toggleUserTag(tagId) {
  const user = users.find(u => u.id === modalUserId);
  if (!user) return;
  if (!user.tags) user.tags = [];
  if (user.tags.includes(tagId)) {
    user.tags = user.tags.filter(x => x !== tagId);
  } else {
    user.tags.push(tagId);
  }
  user.updatedAt = Date.now();
  saveData();
  renderTagModal();
  render();
}

function removeTagFromUser(tagId) {
  const user = users.find(u => u.id === modalUserId);
  if (!user || !user.tags) return;
  user.tags = user.tags.filter(x => x !== tagId);
  user.updatedAt = Date.now();
  saveData();
  renderTagModal();
  render();
}

function createTag() {
  const input = document.getElementById('newTagName');
  const name = input.value.trim();
  if (!name) { showToast('请输入标签名'); return; }
  if (tags.some(t => t.name === name)) { showToast('标签已存在'); return; }
  const color = TAG_COLORS[tags.length % TAG_COLORS.length];
  const newTag = { id: genTagId(), name, color };
  tags.push(newTag);
  // 自动赋给当前用户
  const user = users.find(u => u.id === modalUserId);
  if (user) {
    if (!user.tags) user.tags = [];
    user.tags.push(newTag.id);
    user.updatedAt = Date.now();
  }
  saveTags();
  saveData();
  input.value = '';
  renderTagModal();
  render();
  renderTagFilterBar();
  showToast(`已创建标签「${name}」`);
}

function startTagEdit(tagId) {
  tagEditId = tagId;
  renderTagModal();
  setTimeout(() => { const el = document.getElementById('tagEditInput'); if (el) { el.focus(); el.select(); } }, 30);
}

function cancelTagEdit() {
  tagEditId = null;
  renderTagModal();
}

function commitTagRename(tagId) {
  const el = document.getElementById('tagEditInput');
  const name = el ? el.value.trim() : '';
  if (!name) { showToast('标签名不能为空'); return; }
  const t = getTag(tagId);
  if (t) t.name = name;
  tagEditId = null;
  saveTags();
  renderTagModal();
  render();
  renderTagFilterBar();
  showToast('已重命名');
}

function deleteTag(tagId) {
  const t = getTag(tagId);
  if (!t) return;
  tags = tags.filter(x => x.id !== tagId);
  users.forEach(u => { if (u.tags) u.tags = u.tags.filter(x => x !== tagId); });
  if (activeTagFilter === tagId) activeTagFilter = null;
  Object.keys(colFilters).forEach(k => { if (colFilters[k] === tagId) delete colFilters[k]; });
  saveTags();
  saveData();
  renderTagModal();
  render();
  renderTagFilterBar();
  showToast('已删除标签');
}

function toggleDensity() {

    btn.classList.add('btn-outline');
  }
  showToast(compactMode ? '已切换紧凑视图' : '已切换宽松视图');
}

// ====== 批量模式 ======
function toggleBatchMode() {
  batchMode = !batchMode;
  const btn = document.getElementById('batchToggleBtn');
  if (batchMode) {
    btn.textContent = '退出批量';
    btn.classList.remove('btn-outline');
    btn.classList.add('btn-secondary');
    // 显示待跟进列的批量导入区
    const importArea = document.getElementById('importArea');
    if (importArea) importArea.classList.add('show');
  } else {
    btn.textContent = '批量选择';
    btn.classList.remove('btn-secondary');
    btn.classList.add('btn-outline');
    selectedIds.clear();
    const importArea = document.getElementById('importArea');
    if (importArea) importArea.classList.remove('show');
  }
  updateBatchBar();
  render();
}

function toggleSelect(id) {
  if (selectedIds.has(id)) {
    selectedIds.delete(id);
  } else {
    selectedIds.add(id);
  }
  updateBatchBar();
  render();
}

function clearSelection() {
  selectedIds.clear();
  updateBatchBar();
  render();
}

function updateBatchBar() {
  const bar = document.getElementById('batchBar');
  document.getElementById('selectedCount').textContent = selectedIds.size;
  if (batchMode && selectedIds.size > 0) {
    bar.classList.add('show');
  } else {
    bar.classList.remove('show');
  }
}

function populateBatchMoveCol() {
  const sel = document.getElementById('batchMoveCol');
  if (!sel) return;
  sel.innerHTML = COLUMNS.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
}

function batchMoveSelected() {
  if (selectedIds.size === 0) return;
  const colId = document.getElementById('batchMoveCol').value;
  const colName = COLUMNS.find(c => c.id === colId).name;
  showConfirm(`确认将选中的 ${selectedIds.size} 个学员移入「${colName}」？`, () => {
    users.forEach(u => {
      if (selectedIds.has(u.id)) {
        u.column = colId;
        u.updatedAt = Date.now();
      }
    });
    saveData();
    selectedIds.clear();
    updateBatchBar();
    render();
    showToast(`已移入「${colName}」`);
  });
}

function batchDelete() {
  if (selectedIds.size === 0) return;
  showConfirm(`确认删除选中的 ${selectedIds.size} 个学员？此操作不可撤销。`, () => {
    users = users.filter(u => !selectedIds.has(u.id));
    selectedIds.clear();
    updateBatchBar();
    saveData();
    render();
    showToast('已批量删除');
  });
}

// ====== 导入导出 ======
function exportData() {
  const csv = '用户数字,所属列,最近结果,备注,下一步动作,下次跟进,最近联系,更新时间\n' + users.map(u => {
    const colName = COLUMNS.find(c => c.id === u.column)?.name || u.column;
    const clean = v => String(v || '').replace(/,/g, '，').replace(/\n/g, ' ');
    return `${u.number},${colName},${clean(u.lastResult)},${clean(u.note)},${clean(u.nextAction)},${u.nextFollowUpAt ? formatFollowupDate(u.nextFollowUpAt) : ''},${u.lastContactAt ? formatFollowupDate(u.lastContactAt) : ''},${formatTime(u.updatedAt)}`;
  }).join('\n');
  
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `销售跟进_${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('已导出CSV');
}

function importFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const text = e.target.result.replace(/^\ufeff/, '');
    const lines = text.split(/\n/).filter(Boolean);
    let added = 0, skipped = 0;
    lines.forEach(line => {
      const num = line.trim().split(/[,，\t]/)[0].trim();
      if (!num) return;
      if (users.some(u => u.number === num)) {
        skipped++;
      } else {
        users.push({
          id: genId(),
          number: num,
          column: 'pending',
          note: '',
          replied: false,
          tags: [],
          history: [],
          nextFollowUpAt: 0,
          nextAction: '',
          lastResult: '',
          lastContactAt: 0,
          createdAt: Date.now(),
          updatedAt: Date.now()
        });
        added++;
      }
    });
    saveData();
    render();
    showToast(`已导入 ${added} 个用户${skipped > 0 ? `，跳过 ${skipped} 个重复` : ''}`);
  };
  reader.readAsText(file, 'UTF-8');
  event.target.value = '';
}

// ====== 一键备份 / 恢复全部数据 ======
function backupData() {
  const payload = {
    app: 'A1eG4n工作台',
    version: 2,
    exportedAt: new Date().toISOString(),
    users: users,
    tags: tags,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `A1eG4n备份_${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast(`已备份 ${users.length} 名学员、${tags.length} 个标签`);
}

function restoreData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    let data;
    try { data = JSON.parse(e.target.result); }
    catch (err) { showToast('文件解析失败，请选择正确的备份文件'); return; }
    const newUsers = Array.isArray(data.users) ? data.users : (Array.isArray(data) ? data : null);
    if (!newUsers) { showToast('备份文件格式不正确'); return; }
    showConfirm(`恢复将用备份覆盖当前全部数据（当前 ${users.length} 名学员），是否继续？`, () => {
      users = newUsers.map(u => ({
        id: u.id || genId(),
        number: String(u.number ?? ''),
        column: u.column || 'pending',
        note: u.note || '',
        replied: !!u.replied,
        tags: Array.isArray(u.tags) ? u.tags : [],
        history: Array.isArray(u.history) ? u.history : [],
        nextFollowUpAt: Number(u.nextFollowUpAt || 0),
        nextAction: u.nextAction || '',
        lastResult: u.lastResult || '',
        lastContactAt: Number(u.lastContactAt || 0),
        createdAt: u.createdAt || Date.now(),
        updatedAt: u.updatedAt || Date.now(),
      }));
      if (Array.isArray(data.tags)) {
        tags = data.tags.filter(t => t && t.id).map(t => ({ id: t.id, name: t.name || t.id, color: t.color || '#4f46e5' }));
      }
      activeTagFilter = null;
      colFilters = {};
      selectedIds.clear();
      saveData();
      saveTags();
      loadTags();
      render();
      populateBatchMoveCol();
      populateBatchAddTag();
      populateBatchAddCol();
      renderTagFilterBar();
      updateBatchBar();
      showToast(`已恢复 ${users.length} 名学员`);
    });
  };
  reader.readAsText(file, 'UTF-8');
  event.target.value = '';
}

// ====== 工具函数 ======
function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function formatTime(ts) {
  const diff = Date.now() - ts;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
  if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
  const d = new Date(ts);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => toast.classList.remove('show'), 2000);
}

// ====== 启动 ======
init();
</script>
