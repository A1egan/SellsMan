<!doctype html><html><head><meta charset="utf-8"><title>Cloud Sync Probe</title></head><body>
<div id="result">pending</div>
<script src="../assets/cloud-sync-core.js"></script>
<script src="../assets/cloud-sync.js"></script>
<script>
(async () => {
  const result = document.getElementById('result');
  try {
    localStorage.clear();
    const key='sales_followup_data_v3', pendingKey='sales_cloud_pending_v1';
    const initial=[{id:'u_1',number:'强化2群',note:'old'}];
    localStorage.setItem(key,JSON.stringify(initial));
    let fromCalls=0, rpcCalls=0;
    const fakeClient={
      rpc: async()=>{rpcCalls++; return {data:null,error:new Error('offline')};},
      from:()=>{fromCalls++;const q={select(){return q},order(){return q},gte(){return q},eq(){return q},maybeSingle(){return Promise.resolve({data:null,error:null})},then(r,j){return Promise.resolve({data:[],error:null}).then(r,j)}};return q;},
      auth:{signInWithOtp:async()=>({error:new Error('auth failed')}),signOut:async()=>({error:null})}
    };
    CloudSync._setTestState({client:fakeClient,session:{user:{id:'owner-a',email:'a@example.com'}},initialized:true,error:'',flushing:false});
    CloudSync._snapshotStores();
    const changed=[{id:'u_1',number:'强化2群',note:'new'}];
    localStorage.setItem(key,JSON.stringify(changed));
    CloudSync.observeStoreWrite('customers',changed);
    await new Promise(r=>setTimeout(r,30));
    const localFirst=JSON.parse(localStorage.getItem(key))[0].note==='new';
    const pendingSurvives=JSON.parse(localStorage.getItem(pendingKey)||'[]').length===1;
    try{await CloudSync.login('a@example.com')}catch(_){ }
    const authSafe=JSON.parse(localStorage.getItem(key))[0].note==='new';
    localStorage.setItem(pendingKey,'[]');
    CloudSync._setTestState({error:'',flushing:false});
    window.dispatchEvent(new Event('focus'));
    await new Promise(r=>setTimeout(r,320));
    const focusPull=fromCalls>=3;
    if(!(localFirst&&pendingSurvives&&authSafe&&focusPull)) throw new Error(JSON.stringify({localFirst,pendingSurvives,authSafe,focusPull,rpcCalls,fromCalls}));
    result.id='result-done'; result.textContent=JSON.stringify({localFirst,pendingSurvives,authSafe,focusPull});
  }catch(e){result.textContent='FAIL '+(e.stack||e);}
})();
</script></body></html>
