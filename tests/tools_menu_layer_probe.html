<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Tools menu layering probe</title></head>
<body>
  <pre id="result">pending</pre>
  <iframe id="app" src="../index.html#board" style="width:1440px;height:900px;border:0"></iframe>
  <script>
    const frame = document.getElementById('app');
    const result = document.getElementById('result');

    function finish(data, ok) {
      result.textContent = JSON.stringify(data);
      result.id = ok ? 'result-done' : 'result-error';
    }

    function styleInfo(el) {
      if (!el) return null;
      const s = getComputedStyle(el);
      return {
        tag: el.tagName,
        id: el.id || '',
        cls: el.className || '',
        position: s.position,
        z: s.zIndex,
        transform: s.transform,
        opacity: s.opacity,
        filter: s.filter,
        backdrop: s.backdropFilter,
        isolation: s.isolation,
        contain: s.contain,
        willChange: s.willChange
      };
    }

    setTimeout(() => {
      try {
        const doc = frame.contentDocument;
        const button = doc && doc.getElementById('toolsMenuBtn');
        const menu = doc && doc.getElementById('toolsMenu');
        const board = doc && doc.getElementById('board');
        const sourceCard = doc && doc.querySelector('.card');
        if (!button || !menu || !board || !sourceCard) throw new Error('board tools menu not ready');

        button.click();
        if (!menu.classList.contains('show')) throw new Error('tools menu did not open');

        const menuRect = menu.getBoundingClientRect();
        const probeCard = sourceCard.cloneNode(true);
        probeCard.id = 'menuLayerProbeCard';
        probeCard.style.setProperty('position', 'fixed', 'important');
        probeCard.style.setProperty('left', `${menuRect.left + 16}px`, 'important');
        probeCard.style.setProperty('top', `${menuRect.top + 16}px`, 'important');
        probeCard.style.setProperty('width', '112px', 'important');
        probeCard.style.setProperty('height', '80px', 'important');
        probeCard.style.setProperty('margin', '0', 'important');
        probeCard.style.setProperty('transform', 'translateZ(0)', 'important');
        probeCard.style.setProperty('z-index', 'auto', 'important');
        doc.body.appendChild(probeCard);

        const cardRect = probeCard.getBoundingClientRect();
        const left = Math.max(menuRect.left, cardRect.left);
        const right = Math.min(menuRect.right, cardRect.right);
        const top = Math.max(menuRect.top, cardRect.top);
        const bottom = Math.min(menuRect.bottom, cardRect.bottom);
        const overlapFound = right - left > 8 && bottom - top > 8;
        if (!overlapFound) {
          finish({ menuOpen: true, overlapFound: false, menuRect, cardRect }, false);
          return;
        }

        const x = (left + right) / 2;
        const y = (top + bottom) / 2;
        const topmost = doc.elementFromPoint(x, y);
        const topmostInMenu = !!(topmost && menu.contains(topmost));
        const menuChain = [];
        for (let el = menu; el && el !== doc.documentElement; el = el.parentElement) menuChain.push(styleInfo(el));

        finish({
          menuOpen: true,
          overlapFound,
          topmostInMenu,
          topmost: styleInfo(topmost),
          menu: styleInfo(menu),
          menuChain,
          probeCard: styleInfo(probeCard),
          probeChild: styleInfo(probeCard.firstElementChild),
          probeX: Math.round(x),
          probeY: Math.round(y)
        }, true);
      } catch (err) {
        finish({ error: String(err) }, false);
      }
    }, 3600);
  </script>
</body>
</html>
