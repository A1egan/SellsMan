<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Tools menu layering probe</title></head>
<body>
  <pre id="result">pending</pre>
  <iframe id="app" src="../index.html#board" style="width:1440px;height:900px;border:0"></iframe>
  <script>
    const frame = document.getElementById('app');
    const result = document.getElementById('result');

    function finish(data, ok) {
      result.textContent = JSON.stringify(data);
      result.id = ok ? 'result-done' : 'result-error';
    }

    setTimeout(() => {
      try {
        const doc = frame.contentDocument;
        const button = doc && doc.getElementById('toolsMenuBtn');
        const menu = doc && doc.getElementById('toolsMenu');
        const board = doc && doc.getElementById('board');
        if (!button || !menu || !board) throw new Error('board tools menu not ready');

        button.click();
        if (!menu.classList.contains('show')) throw new Error('tools menu did not open');

        const menuRect = menu.getBoundingClientRect();
        const overlapCard = doc.querySelector('.card');
        if (!overlapCard) throw new Error('no customer card for layering probe');

        // Five-column desktop fit changes natural card positions. Move one real card
        // underneath the open menu using transform, which preserves the production
        // card stacking-context behavior we actually want to test.
        const originalRect = overlapCard.getBoundingClientRect();
        const targetLeft = menuRect.left + Math.min(18, Math.max(4, menuRect.width / 4));
        const targetTop = menuRect.top + Math.min(18, Math.max(4, menuRect.height / 4));
        const dx = targetLeft - originalRect.left;
        const dy = targetTop - originalRect.top;
        overlapCard.style.transform = `translate(${dx}px, ${dy}px)`;

        const cardRect = overlapCard.getBoundingClientRect();
        const left = Math.max(menuRect.left, cardRect.left);
        const right = Math.min(menuRect.right, cardRect.right);
        const top = Math.max(menuRect.top, cardRect.top);
        const bottom = Math.min(menuRect.bottom, cardRect.bottom);
        const overlapFound = right - left > 8 && bottom - top > 8;
        if (!overlapFound) {
          finish({ menuOpen: true, overlapFound: false, menuRect, cardRect }, false);
          return;
        }

        const x = (left + right) / 2;
        const y = (top + bottom) / 2;
        const topmost = doc.elementFromPoint(x, y);
        const topmostInMenu = !!(topmost && menu.contains(topmost));

        finish({
          menuOpen: true,
          overlapFound,
          topmostInMenu,
          topmostTag: topmost ? topmost.tagName : null,
          topmostClass: topmost ? topmost.className : null,
          headerPosition: getComputedStyle(menu.closest('.header')).position,
          headerBackdropFilter: getComputedStyle(menu.closest('.header')).backdropFilter,
          menuZIndex: getComputedStyle(menu).zIndex,
          probeX: Math.round(x),
          probeY: Math.round(y)
        }, true);
      } catch (err) {
        finish({ error: String(err) }, false);
      }
    }, 3600);
  </script>
</body>
</html>
